<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#111111">
<title>Carson Dinner Wheel</title>
<style>
  :root { --size:min(84vw, 430px); }
  * { box-sizing:border-box; }
  body {
    margin:0; min-height:100svh; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    background:linear-gradient(180deg,#171717,#292929); color:white;
    display:flex; justify-content:center; text-align:center;
  }
  main { width:min(94vw,560px); padding:28px 12px 40px; }
  h1 { margin:4px 0 3px; font-size:clamp(28px,8vw,44px); }
  .sub { opacity:.75; margin:0 0 24px; }
  .wheel-wrap { position:relative; width:var(--size); height:var(--size); margin:0 auto 24px; }
  .pointer {
    position:absolute; z-index:5; top:-11px; left:50%; transform:translateX(-50%);
    width:0; height:0; border-left:18px solid transparent; border-right:18px solid transparent;
    border-top:34px solid white; filter:drop-shadow(0 3px 2px #0008);
  }
  #wheel {
    width:100%; height:100%; border-radius:50%; border:8px solid #f6f6f6;
    box-shadow:0 12px 35px #0008; transition:transform 4.6s cubic-bezier(.12,.72,.08,1);
    display:block;
  }
  button {
    appearance:none; border:0; border-radius:999px; padding:16px 38px;
    font-weight:900; font-size:22px; background:white; color:#111;
    box-shadow:0 6px 0 #aaa; cursor:pointer;
  }
  button:active { transform:translateY(3px); box-shadow:0 3px 0 #aaa; }
  button:disabled { opacity:.55; }
  #result { min-height:62px; margin:23px auto 0; font-size:18px; opacity:.9; }
  #result strong { display:block; font-size:27px; margin-top:5px; color:#fff; }
  .tiny { opacity:.55; font-size:12px; margin-top:24px; }
</style>
</head>
<body>
<main>
  <h1>🎡 Dinner Wheel</h1>
  <p class="sub">The wheel decides. You get one veto. 😈</p>
  <div class="wheel-wrap">
    <div class="pointer"></div>
    <canvas id="wheel" width="900" height="900"></canvas>
  </div>
  <button id="spin">SPIN FOR DINNER</button>
  <div id="result">Five contenders. One dinner.</div>
  <div class="tiny">Baby Wheel v0.1 • Carson House Test Kitchen</div>
</main>
<script>
const meals = ["Kylie's Birthday Shrimp Pasta", "Fancy Korean Chicken Ramen", "Cast Iron Lemon Garlic Tilapia", "Chili", "Cast Iron Steaks", "Chili Dogs", "Spaghetti & Meatballs", "Chicken Alfredo", "Cast Iron Cajun Sausage", "Buffalo Chicken Mac", "TacoLosh", "Chillosh", "Salmon", "Chicken Broccoli & Rice", "Cubans", "Smoky Pork Mac", "Cabin Chicken", "Mother Pork Poblano Bowls", "Mother Pork Miso Ramen", "Ball Park Burger Night"];
const canvas = document.getElementById('wheel');
const ctx = canvas.getContext('2d');
const btn = document.getElementById('spin');
const result = document.getElementById('result');
const colors = ['#e4572e','#17bebb','#ffc914','#7d53de','#76b041'];
const n = meals.length;
const arc = Math.PI*2/n;
let rotation = 0;

function drawWheel(){
  const cx=450, cy=450, r=430;
  ctx.clearRect(0,0,900,900);
  for(let i=0;i<n;i++){
    // Center segment 0 on 12 o'clock.
    const mid = -Math.PI/2 + i*arc;
    const start = mid - arc/2, end = mid + arc/2;
    ctx.beginPath(); ctx.moveTo(cx,cy); ctx.arc(cx,cy,r,start,end); ctx.closePath();
    ctx.fillStyle=colors[i%colors.length]; ctx.fill();
    ctx.lineWidth=7; ctx.strokeStyle='#ffffff'; ctx.stroke();

    ctx.save();
    ctx.translate(cx,cy);
    ctx.rotate(mid);
    ctx.textAlign='right'; ctx.textBaseline='middle';
    ctx.fillStyle='#fff'; ctx.font='bold 37px -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif';
    ctx.shadowColor='#0009'; ctx.shadowBlur=5;
    const label=meals[i];
    const max=20;
    if(label.length>max){
      const words=label.split(' '); let a='', b='';
      for(const w of words){ if((a+' '+w).trim().length<=max) a=(a+' '+w).trim(); else b=(b+' '+w).trim(); }
      ctx.fillText(a,r-34,-22); ctx.fillText(b,r-34,24);
    } else ctx.fillText(label,r-34,0);
    ctx.restore();
  }
  ctx.beginPath(); ctx.arc(cx,cy,76,0,Math.PI*2); ctx.fillStyle='#fff'; ctx.fill();
  ctx.beginPath(); ctx.arc(cx,cy,52,0,Math.PI*2); ctx.fillStyle='#222'; ctx.fill();
  ctx.fillStyle='#fff'; ctx.font='900 25px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('DINNER',cx,cy);
}
drawWheel();

btn.addEventListener('click',()=>{
  btn.disabled=true; result.textContent='🎡 The wheel has spoken...';
  const winner=Math.floor(Math.random()*n);
  // Segment winner's center should end at 12 o'clock.
  const currentMod=((rotation%360)+360)%360;
  const desired=((360 - winner*(360/n))%360);
  let delta=(desired-currentMod+360)%360;
  delta += 360*(5+Math.floor(Math.random()*3));
  rotation += delta;
  canvas.style.transform=`rotate(${rotation}deg)`;
  setTimeout(()=>{
    result.innerHTML=`Tonight we're having…<strong>${meals[winner]}</strong>`;
    btn.disabled=false; btn.textContent='SPIN AGAIN';
  },4700);
});
</script>
</body>
</html>
